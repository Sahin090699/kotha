name: Android CI

on:
  push:
    branches: [main, fix/principal-engineer-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Verify Gradle toolchain
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
